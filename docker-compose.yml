# version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: suamp-db
    environment:
      POSTGRES_USER: suamp
      POSTGRES_PASSWORD: suamp_2080
      POSTGRES_DB: suamp_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: suamp-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
